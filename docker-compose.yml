name: ${COMPOSE_PROJECT_NAME:-griipbuddy-employee}
services:
  employee-db:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
      TZ: UTC
    volumes:
      - employee-postgres:/var/lib/postgresql
      - ./docker/init-runtime.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 1
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  employee-app:
    build: .
    image: griipbuddy-employee:foundation
    restart: unless-stopped
    depends_on:
      employee-db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      TZ: UTC
      HOSTNAME: 0.0.0.0
      PORT: 3000
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL}
      AUTH_URL: ${APP_BASE_URL:?Set APP_BASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      ALLOW_LOCAL_HTTP: ${ALLOW_LOCAL_HTTP:-false}
      DATABASE_URL: postgresql://employee_runtime:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}@employee-db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      PRIVATE_DOCUMENTS_DIR: /app/private/documents
    volumes:
      - employee-documents:/app/private/documents
    ports: ["127.0.0.1:${APP_PORT:-3000}:3000"]
    networks: [frontend, backend]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
networks:
  frontend: {}
  backend: { internal: true }
volumes:
  employee-postgres: {}
  employee-documents: {}
